<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OG Card — Render at 1200×630, then screenshot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    /* Reset + viewport pinned to OG card dimensions. Open in Chrome,
       resize window so the .card box is fully visible (or use devtools
       device-mode at 1200x630), then take a screenshot of the .card. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #2a1810;
      font-family: 'DM Sans', system-ui, sans-serif;
      color: #f5f5f5;
    }
    .card {
      width: 1200px;
      height: 630px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #1c1410 0%, #2a1810 50%, #1a0e0a 100%);
      padding: 80px 90px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Subtle texture / glow */
    .card::before {
      content: '';
      position: absolute;
      top: -200px;
      right: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(217, 119, 6, 0.18) 0%, transparent 60%);
      pointer-events: none;
    }
    .card::after {
      content: '';
      position: absolute;
      bottom: -300px;
      left: -150px;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(120, 53, 15, 0.15) 0%, transparent 65%);
      pointer-events: none;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
      z-index: 2;
    }
    .logo-mark {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Serif Display', serif;
      font-size: 28px;
      color: #2a1810;
      font-weight: 700;
    }
    .brand {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .body {
      position: relative;
      z-index: 2;
      max-width: 880px;
    }
    .eyebrow {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #d97706;
      margin-bottom: 24px;
    }
    .headline {
      font-family: 'DM Serif Display', serif;
      font-size: 72px;
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: #f5f5f5;
      margin-bottom: 24px;
    }
    .headline em {
      font-style: italic;
      color: #d97706;
    }
    .subhead {
      font-size: 22px;
      line-height: 1.45;
      color: #a8a29e;
      max-width: 720px;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #f5f5f5;
      color: #1c1410;
      padding: 16px 28px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
    }
    .cta::after {
      content: '→';
      font-size: 22px;
    }
    .domain {
      font-size: 16px;
      color: #78716c;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo-mark">S</div>
      <div class="brand">SafiriPro</div>
    </div>

    <div class="body">
      <div class="eyebrow">Built in Nairobi · For African Travel Operators</div>
      <h1 class="headline">Run your safari<br/>business <em>from one place.</em></h1>
      <p class="subhead">Quotes, CRM, vouchers, invoices — and AI that uses your own inventory. The operating system for travel operators.</p>
    </div>

    <div class="footer">
      <div class="cta">Start free for 14 days</div>
      <div class="domain">safiripro.com</div>
    </div>
  </div>
</body>
</html>
